{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | FAJUAR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'login.css' %}?v=2">
</head>

<body>

    <main class="login-page">

        <section class="login-card" aria-labelledby="login-titulo">

            <div class="login-header">
                <a href="/" class="logo" aria-label="FAJUAR, volver al inicio">
                    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
                        <rect width="32" height="32" rx="8"/>
                        <path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z"/>
                    </svg>
                    <span>FAJUAR</span>
                </a>

                <h1 id="login-titulo">Iniciar sesión</h1>
                <p>Acceso para el personal del hospital</p>
            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Tu usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">
                    Ingresar
                </button>

            </form>

            {% if mensaje %}
                <p class="mensaje-error" role="alert">
                    {{ mensaje }}
                </p>
            {% endif %}

            <a href="/" class="volver">Volver al inicio</a>

        </section>

    </main>

</body>

</html>
