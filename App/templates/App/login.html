<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Login</title>

</head>

<body>

    <h1>Iniciar Sesión</h1>

    <form method="POST">

        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="Correo electrónico"
            required
        >

        <br><br>

        <input
            type="text"
            name="usuario"
            placeholder="Usuario"
            required
        >

        <br><br>

        
        <input
            type="password"
            name="contraseña"
            placeholder="Contraseña"
            required
        >

        <br><br>

        <button type="submit">
            Ingresar
        </button>

    </form>

    {% if mensaje %}
        <p style="color:red;">
            {{ mensaje }}
        </p>
    {% endif %}

</body>

</html>
